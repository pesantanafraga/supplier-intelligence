<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1b1626;--mut:#6a6577;--bd:#d9d8e0;--ac:#5b2a5e;--ok:#17715a;--al:#b4691a;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#14111a;--card:#1d1926;--tx:#ece9f2;--mut:#a39db1;--bd:#363043;--ac:#d9a6dc;--ok:#5fcfa8;--al:#e0a25a;--er:#f08a82}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Public Sans',system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 60px}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}
h1{font-size:2rem;line-height:1.1}.sub{color:var(--mut);margin:6px 0 20px;max-width:60ch}
form{display:grid;gap:10px;grid-template-columns:1fr 200px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;min-height:44px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#st{min-height:1.5em;color:var(--mut)}#st.e{color:var(--er)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin:12px 0}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.nm{font-size:1.15rem}.dom{color:var(--mut);font-size:.9rem;word-break:break-all}
.notas{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}.n b{font-size:1.5rem;font-family:'Bricolage Grotesque',sans-serif}.n small{display:block;color:var(--mut)}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:.85rem;margin:0 6px 6px 0}
.ok{color:var(--ok);border-color:var(--ok)}.al{color:var(--al);border-color:var(--al)}.er{color:var(--er);border-color:var(--er)}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.acoes>*{min-height:38px;padding:6px 12px;font-size:.9rem}
details{margin-top:8px}summary{cursor:pointer;color:var(--ac);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:6px 0}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}
.nv{color:var(--mut)}a{color:var(--ac)}h2{margin-top:28px;font-size:1.2rem}
@media(max-width:560px){form{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>Supplier Intelligence</h1>
<p class="sub">Descreva o que você quer comprar. O sistema busca empresas reais, abre os sites, confere o CNPJ na base oficial e mostra de onde veio cada informação.</p>
<form id="f">
  <input id="q" required minlength="3" maxlength="200" placeholder="Ex.: perfumes árabes originais no atacado" aria-label="Produto procurado">
  <select id="reg" aria-label="Região"><option value="Baixada Santista SP">Baixada Santista</option><option value="Brás São Paulo">Brás (São Paulo)</option><option value="Grande São Paulo">Grande São Paulo</option><option value="Brasil">Brasil todo</option></select>
  <button class="p">Pesquisar</button><button type="button" id="csv">Exportar CSV</button>
</form>
<div id="st" role="status"></div>
<div id="res"></div><div id="man"></div>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let senha=localStorage.getItem('si_senha')||'', est=JSON.parse(localStorage.getItem('si_estado')||'{}'), itens=[], manuais=[], gen=0;
const salvar=()=>localStorage.setItem('si_estado',JSON.stringify(est)), st=(t,e)=>{$('#st').textContent=t;$('#st').className=e?'e':''};
const STATUS=['Descoberto','Em validação','Contato realizado','Aguardando orçamento','Em negociação','Aprovado','Descartado'];
async function api(rota,corpo){
  for(let t=0;t<2;t++){
    if(!senha){senha=prompt('Senha de acesso:')||'';localStorage.setItem('si_senha',senha)}
    const r=await fetch('/api/'+rota,{method:'POST',headers:{'content-type':'application/json','x-app-pass':senha},body:JSON.stringify(corpo)});
    if(r.status===401&&t===0){senha='';localStorage.removeItem('si_senha');continue}
    const j=await r.json().catch(()=>({erro:'Resposta inválida do servidor'}));
    if(!r.ok) throw new Error(j.erro||'Erro '+r.status);
    return j;
  }
}
$('#f').onsubmit=async e=>{
  e.preventDefault(); const meu=++gen; itens=[]; manuais=[]; render(); st('Gerando consultas e buscando empresas…');
  let b; try{b=await api('search',{q:$('#q').value,regiao:$('#reg').value})}catch(x){return st(x.message,true)}
  manuais=b.manuais; render(); const fila=b.empresas.slice(0,20), total=fila.length; let feito=0;
  if(!total) return st((b.avisos||[]).join(' ')||'Nenhuma empresa encontrada.',true);
  const w=async()=>{while(fila.length&&meu===gen){const c=fila.shift();st(`Investigando sites: ${feito}/${total} (${c.dominio})`);
    try{add({...c,...await api('inspect',{url:c.url})})}catch(x){add({...c,falha:x.message})} feito++;}};
  await Promise.all([w(),w(),w()]);
  if(meu===gen) st(`Concluído: ${itens.length} empresas analisadas. ${(b.avisos||[]).join(' ')}`);
};
function add(r){
  const ch=r.cnpj||r.dominio, ex=itens.find(i=>(i.cnpj||i.dominio)===ch);
  if(ex){ex.tambem=[...(ex.tambem||[]),r.dominio];} else itens.push(r); render();
}
const nome=i=>i.oficial?.fantasia||i.oficial?.razao||i.titulo||i.dominio;
const cor=v=>v>=65?'ok':v>=35?'al':'er';
function msg(i){return `Olá! Estou estruturando uma operação de revenda de perfumes e cosméticos e gostaria de conhecer as condições comerciais da ${nome(i)}. Poderiam enviar catálogo atualizado, tabela de atacado, pedido mínimo, condições de pagamento, disponibilidade de estoque, emissão de nota fiscal e opções de envio para Santos/SP?`}
function card(i){
  const n=i.notas, o=i.oficial, c=i.contatos||{}, e=est[i.dominio]||{};
  const nb=(k,t)=>`<div class="n"><b class="${cor(n[k].valor)}" style="color:var(--${{ok:'ok',al:'al',er:'er'}[cor(n[k].valor)]})">${n[k].valor}</b><small>${t}<br>${n[k].cobertura}% das informações</small></div>`;
  const tb=k=>`<table>${n[k].itens.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.valor===null?'<span class=nv>sem informação</span>':x.valor}</td><td class=nv>${esc(x.detalhe)}</td></tr>`).join('')}</table>`;
  const wa=c.whatsapp?.[0];
  return `<article class="card"><div class="top"><div><h3 class="nm">${e.fav?'★ ':''}${esc(nome(i))}</h3><div class="dom"><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.dominio)}</a>${i.tambem?.length?' (também: '+esc(i.tambem.join(', '))+')':''}</div></div>
  <select data-s="${esc(i.dominio)}" aria-label="Status">${STATUS.map(s=>`<option${s===(e.status||'Descoberto')?' selected':''}>${s}</option>`).join('')}</select></div>
  <div class="notas">${nb('confiabilidade','Confiabilidade')}${nb('procedencia','Procedência (indícios)')}${nb('oportunidade','Oportunidade')}</div>
  <div>${o?`<span class="tag ${/^ATIVA/i.test(o.situacao)?'ok':'er'}">CNPJ ${esc(o.situacao)}</span><span class="tag">${esc(i.cnpj)}</span><span class="tag">${esc(o.cidade)}/${esc(o.uf)}</span>`:`<span class="tag al">CNPJ não confirmado</span>`}
  ${c.telefones?.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||''}${c.emails?.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||''}${c.instagram?`<span class="tag">@${esc(c.instagram)}</span>`:''}${wa?`<span class="tag">WhatsApp ${esc(wa)}</span>`:''}</div>
  <details><summary>Como as notas foram calculadas</summary><p><b>Confiabilidade</b></p>${tb('confiabilidade')}<p><b>Procedência</b> (indícios, não garantia)</p>${tb('procedencia')}<p><b>Oportunidade</b></p>${tb('oportunidade')}
  <p><b>Fontes consultadas</b></p><ul>${i.fontes.map(f=>`<li>${esc(f.tipo)}, em ${f.data}: <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.url)}</a></li>`).join('')}</ul>${(i.avisos||[]).map(a=>`<p class="nv">⚠ ${esc(a)}</p>`).join('')}
  <p class="nv">Achado pela busca: ${esc(i.termos?.join(' | '))}</p></details>
  <div class="acoes"><button data-f="${esc(i.dominio)}">${e.fav?'Remover dos favoritos':'Favoritar'}</button><button data-m="${esc(i.dominio)}">Copiar mensagem</button>${wa?`<a href="https://wa.me/${esc(wa)}?text=${encodeURIComponent(msg(i))}" target="_blank" rel="noopener"><button type="button">Abrir WhatsApp</button></a>`:''}</div></article>`;
}
function render(){
  const bons=itens.filter(i=>i.notas).sort((a,b)=>b.notas.confiabilidade.valor-a.notas.confiabilidade.valor||b.notas.oportunidade.valor-a.notas.oportunidade.valor);
  const ruins=itens.filter(i=>!i.notas);
  $('#res').innerHTML=bons.map(card).join('');
  $('#man').innerHTML=(ruins.length||manuais.length)?`<h2>Para validar manualmente</h2><p class="nv">Sites que bloquearam leitura automática, falharam, ou redes sociais/marketplaces (não são lidos por robô).</p><ul>${ruins.map(i=>`<li><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.dominio)}</a>: ${esc(i.falha||i.avisos?.[0]||'')}</li>`).join('')}${manuais.map(m=>`<li><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.titulo||m.url)}</a></li>`).join('')}</ul>`:'';
}
document.addEventListener('click',e=>{
  const t=e.target, d=t.dataset||{}, ach=k=>itens.find(i=>i.dominio===k);
  if(d.f){est[d.f]={...est[d.f],fav:!est[d.f]?.fav};salvar();render()}
  if(d.m){navigator.clipboard.writeText(msg(ach(d.m))).then(()=>st('Mensagem copiada.'))}
});
document.addEventListener('change',e=>{const k=e.target.dataset?.s;if(k){est[k]={...est[k],status:e.target.value};salvar()}});
$('#csv').onclick=()=>{
  const L=[['nome','site','cnpj','situacao','cidade','uf','telefone','whatsapp','email','instagram','confiabilidade','cobertura_confiab','oportunidade','status']];
  itens.filter(i=>i.notas).forEach(i=>L.push([nome(i),i.url,i.cnpj,i.oficial?.situacao,i.oficial?.cidade,i.oficial?.uf,i.contatos.telefones[0],i.contatos.whatsapp[0],i.contatos.emails[0],i.contatos.instagram,i.notas.confiabilidade.valor,i.notas.confiabilidade.cobertura,i.notas.oportunidade.valor,est[i.dominio]?.status||'Descoberto']));
  const s=L.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download='fornecedores.csv';a.click();
};
</script>
</body></html>
